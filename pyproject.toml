[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# This is the PYPI name (what users pip install)
name = "dvst-detox"

version = "0.2.1"
description = "Lightweight Python wrapper around tobii-researcher"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "tobii-research",
    "psychopy",
]

authors = [
    { name = "Tommaso Ghilardi", email = "tommaso.ghilardi93@gmail.com" },
]

[tool.setuptools]

# Automatically discover the DeToX package and its subpackages
# (e.g. DeToX.gui) so new subpackages ship without extra edits.
[tool.setuptools.packages.find]
where = ["."]
include = ["DeToX*"]

[tool.setuptools.package-data]
DeToX = ["stimuli/*.png", "stimuli/*.mp4", "stimuli/*.wav"]